# Security gate: fails the build on a vulnerable dependency or a committed secret.
# Runs on every push and pull request to main, and weekly (so a newly-published advisory is caught
# even when nothing changed). See docs/security/SECURITY_SCORECARD.md (CI gate) and the master prompt §42.
#
# Actions are pinned to a major tag here; hardening follow-up (master prompt §41) is to pin each to a full commit SHA.
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC — catch advisories published since the last push
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Resolve the dependency tree from the committed lockfile without running native build scripts:
      # the audit only needs the tree, and skipping scripts keeps the job fast and side-effect-free.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Fail on HIGH or CRITICAL in production dependencies. Dev-only advisories do not block a deploy
      # (they do not ship), but surface them without failing so they are not invisible.
      - name: Audit production dependencies (fail on high/critical)
        run: pnpm audit --prod --audit-level high
      - name: Audit all dependencies (report only)
        if: always()
        run: pnpm audit --audit-level high || true

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history, not just the latest commit
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
